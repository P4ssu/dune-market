[project]
name = "dune-market"
version = "0.1.0"
description = "Live in-game Dune: Awakening Exchange price popup"
requires-python = ">=3.11"
dependencies = [
    "mss",
    "pillow",
    "rapidocr-onnxruntime",
    "PyQt6",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
