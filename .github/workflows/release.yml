name: Release

# Pushing a version tag (for example v1.2.1) builds the program and publishes it as a GitHub release.
# Running copies of the program find the newest release and update themselves (see src/dune_market/update.py).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the program version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content src/dune_market/__init__.py -Raw
          $version = [regex]::Match($text, '__version__ = "(.+?)"').Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag does not match __version__ $version in src/dune_market/__init__.py" }

      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build the program
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --name DuneMarket --console
          --icon packaging/dune-market.ico --paths src --collect-all rapidocr_onnxruntime
          --hidden-import PyQt6.sip --exclude-module tkinter --exclude-module matplotlib
          --exclude-module pytest packaging/launch.py

      - name: Check the built program
        run: ./dist/DuneMarket/DuneMarket.exe selftest

      - name: Make the update package (the program only, never any settings)
        shell: pwsh
        run: |
          Compress-Archive -Path dist\DuneMarket\* -DestinationPath DuneMarket-update.zip -CompressionLevel Optimal
          $hash = (Get-FileHash DuneMarket-update.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  DuneMarket-update.zip" | Out-File -Encoding ascii DuneMarket-update.zip.sha256

      - name: Release notes from the tag message
        shell: pwsh
        run: |
          git fetch --tags --force
          $notes = git for-each-ref --format='%(contents)' "refs/tags/${{ github.ref_name }}"
          if (-not "$notes".Trim()) { $notes = "Version ${{ github.ref_name }}" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            DuneMarket-update.zip
            DuneMarket-update.zip.sha256
