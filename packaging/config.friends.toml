# Dune Market settings. Install.bat asks for your name and fills it in for you.
# If you edit this file yourself, change only the lines below and save.

# Your in-game name. Friends see it in the popup: "Updated 2 h ago by <your name>".
contributor = "WRITE-YOUR-NAME-HERE"

# The key that opens and closes the price search (modifiers: ctrl, shift, alt, win + one key).
search_hotkey = "ctrl+shift+f"

# Shared price database (do not change).
[remote]
url = "{{URL}}"
key = "{{KEY}}"
world = "{{WORLD}}"
